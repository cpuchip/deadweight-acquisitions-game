# Deadweight Acquisitions — multiplayer.
# Local:  docker compose up --build   ->  http://localhost:8080 (open two tabs)
# Deploy: Dokploy builds this compose; map the domain to the `game` service on 8080.

services:
  game:
    build: .
    container_name: deadweight-game
    restart: unless-stopped
    environment:
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
